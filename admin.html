<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocksmith Live — Admin</title>
<link rel="stylesheet" href="styles.css?v=20260821092645">
</head>
<body>

<div class="wrap" id="loginWrap">
  <div class="center-card">
    <h1>🎸 Admin</h1>
    <form id="loginForm" class="panel">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="username">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password">
      <div class="actions">
        <button type="submit" class="primary" id="loginBtn">Se connecter</button>
        <button type="button" class="ghost" id="signupBtn">Créer un compte</button>
      </div>
      <div id="loginResult"></div>
    </form>
  </div>
</div>

<div class="wrap wide" id="adminWrap" style="display:none">
  <header class="brand">
    <h1 id="channelName">🎸 Admin</h1>
    <div class="row" style="gap:8px; flex:none">
      <span class="status-pill" id="statusPill">…</span>
      <button type="button" class="small ghost" id="logoutBtn">Déconnexion</button>
    </div>
  </header>

  <div id="setupPanel" style="display:none">
    <div class="center-card" style="margin-top:4vh">
      <h1 style="text-align:left">Crée ton channel</h1>
      <form id="setupForm" class="panel">
        <label for="setupName">Nom affiché</label>
        <input id="setupName" required maxlength="60" placeholder="Ex : Alex joue de la basse">
        <label for="setupSlug">Slug public <span class="optional">(dans l'URL, minuscules et tirets)</span></label>
        <input id="setupSlug" required maxlength="40" pattern="[a-z0-9-]+" placeholder="mon-pseudo">
        <div class="actions"><button type="submit" class="primary">Créer mon channel</button></div>
        <div id="setupResult"></div>
      </form>
    </div>
  </div>

  <div id="mainPanels" style="display:none">
    <div class="panel" style="padding:16px; margin-bottom:24px">
      <div id="streamControls"></div>
    </div>

    <div class="tabs">
      <button type="button" class="tab active" data-tab="requests">
        Demandes <span class="badge" id="pendingBadge" style="display:none">0</span>
      </button>
      <button type="button" class="tab" data-tab="queue">File d'attente</button>
      <button type="button" class="tab" data-tab="library">Bibliothèque</button>
      <button type="button" class="tab" data-tab="instruments">Instruments</button>
      <button type="button" class="tab" data-tab="matcher">Matcher</button>
      <button type="button" class="tab" data-tab="settings">Paramètres</button>
    </div>

    <div class="tab-panel active" id="panel-requests">
      <div id="pendingRequests"><div class="empty">Aucune demande en attente.</div></div>
    </div>

    <div class="tab-panel" id="panel-queue">
      <div id="queuedRequests"><div class="empty">File vide.</div></div>
    </div>

    <div class="tab-panel" id="panel-library">
      <form id="libForm" class="panel" style="margin-bottom:16px">
        <div class="row">
          <div><label for="libArtist">Artiste</label><input id="libArtist" required></div>
          <div><label for="libTitle">Titre</label><input id="libTitle" required></div>
        </div>
        <label for="libTuning">Accordage <span class="optional">(optionnel)</span></label>
        <input id="libTuning">
        <label>Instruments compatibles <span class="optional">(optionnel, plusieurs possibles)</span></label>
        <div id="libInstrumentsCheckboxes" class="checkbox-list"></div>
        <div class="actions"><button type="submit" class="primary">Ajouter à la bibliothèque</button></div>
      </form>
      <div id="libraryList"><div class="empty">Bibliothèque vide.</div></div>
    </div>

    <div class="tab-panel" id="panel-instruments">
      <form id="instrumentForm" class="panel" style="margin-bottom:16px">
        <label for="instName">Nom <span class="optional">(optionnel)</span></label>
        <input id="instName" maxlength="60" placeholder="Ex : Music Man SUB5">

        <div class="row">
          <div>
            <label for="instType">Type d'instrument</label>
            <select id="instType">
              <option value="basse">Basse</option>
              <option value="guitare">Guitare</option>
            </select>
          </div>
          <div>
            <label for="instStrings">Nombre de cordes</label>
            <select id="instStrings"></select>
          </div>
        </div>

        <label for="instTuning">Accordage</label>
        <select id="instTuning"></select>
        <input id="instTuningCustom" style="display:none; margin-top:8px" placeholder="Ex : Drop C# personnalisé" maxlength="40">

        <div class="actions"><button type="submit" class="primary">Ajouter l'instrument</button></div>
      </form>
      <div id="instrumentsList"><div class="empty">Aucun instrument configuré.</div></div>
    </div>

    <div class="tab-panel" id="panel-matcher">
      <p class="muted small" style="margin-bottom:16px">
        Teste le Smart Song Matcher sans créer de vraie demande. Le score tient compte
        du consensus entre sources — 85% et plus est considéré comme fiable.
      </p>
      <form id="matcherForm" class="panel" style="margin-bottom:16px">
        <div class="row">
          <div><label for="matcherArtist">Artiste</label><input id="matcherArtist" required placeholder="Ex : The Warning"></div>
          <div><label for="matcherTitle">Titre</label><input id="matcherTitle" required placeholder="Ex : sike"></div>
        </div>
        <div class="actions"><button type="submit" class="primary" id="matcherBtn">Tester</button></div>
      </form>
      <div id="matcherResult"></div>
    </div>

    <div class="tab-panel" id="panel-settings">
      <div class="panel">
        <label for="settingsSlug">Slug public <span class="optional">(non modifiable)</span></label>
        <input id="settingsSlug" type="text" readonly>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script type="module" src="admin.js?v=20260821092645"></script>
</body>
</html>
