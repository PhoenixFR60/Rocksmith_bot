<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocksmith Live — Admin</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap" id="loginWrap">
  <header class="brand"><h1>🎸 Rocksmith Live — Admin</h1></header>
  <form id="loginForm" class="panel">
    <label for="email">Email</label>
    <input id="email" type="email" required>
    <label for="password">Mot de passe</label>
    <input id="password" type="password" required minlength="6">
    <div class="actions">
      <button type="submit" class="primary">Se connecter</button>
      <button type="button" class="ghost" id="signupBtn">Créer un compte</button>
    </div>
    <div id="loginResult"></div>
  </form>
</div>

<div class="wrap wide" id="adminWrap" style="display:none">
  <header class="brand">
    <h1 id="channelName">🎸 Admin</h1>
    <div class="row" style="gap:8px">
      <span class="status-pill" id="statusPill">…</span>
      <button type="button" class="small ghost" id="logoutBtn">Déconnexion</button>
    </div>
  </header>

  <div id="setupPanel" style="display:none">
    <h2 class="eyebrow">Créer ton channel</h2>
    <form id="setupForm" class="panel">
      <label for="setupName">Nom affiché</label>
      <input id="setupName" required maxlength="60">
      <label for="setupSlug">Slug public (dans l'URL)</label>
      <input id="setupSlug" required maxlength="40" pattern="[a-z0-9-]+" placeholder="mon-pseudo">
      <div class="actions"><button type="submit" class="primary">Créer</button></div>
      <div id="setupResult"></div>
    </form>
  </div>

  <div id="mainPanels" style="display:none">
    <h2 class="eyebrow">Session live</h2>
    <div class="panel" style="padding:16px">
      <div id="streamControls"></div>
    </div>

    <h2 class="eyebrow">Demandes en attente</h2>
    <div id="pendingRequests"><div class="empty">Chargement…</div></div>

    <h2 class="eyebrow">File d'attente</h2>
    <div id="queuedRequests"><div class="empty">Chargement…</div></div>

    <h2 class="eyebrow">Bibliothèque</h2>
    <form id="libForm" class="panel" style="margin-bottom:16px">
      <div class="row">
        <div><label for="libArtist">Artiste</label><input id="libArtist" required></div>
        <div><label for="libTitle">Titre</label><input id="libTitle" required></div>
      </div>
      <div class="row">
        <div><label for="libTuning">Accordage</label><input id="libTuning"></div>
        <div><label for="libInstrument">Instrument</label><input id="libInstrument"></div>
      </div>
      <div class="actions"><button type="submit" class="primary">Ajouter à la bibliothèque</button></div>
    </form>
    <div id="libraryTable"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
